name: Release APK

# Build a signed release APK pointed at the cloud Supabase project and attach it
# to the GitHub Release that triggered the run. Runs alongside the migrations
# deploy on the same release event; the two do not depend on each other.
#
# Needs, in the "production" environment:
#   vars.SUPABASE_URL                 cloud project URL (https://<ref>.supabase.co)
#   secrets.SUPABASE_ANON_KEY         cloud project publishable key
#   secrets.RELEASE_KEYSTORE_BASE64   `base64 -w0 release.jks`
#   secrets.RELEASE_KEYSTORE_PASSWORD
#   secrets.RELEASE_KEY_ALIAS
#   secrets.RELEASE_KEY_PASSWORD     optional; defaults to the keystore password
#                                    (PKCS12 keystores, keytool's default, use one)
#
# A manual run builds and uploads the APK as a workflow artifact only.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # attach the APK to the release

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode the signing keystore
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      # Tags are v<major>.<minor>.<patch>. versionName drops the v; versionCode is
      # major*10000 + minor*100 + patch so it rises with every tag. A manual run
      # has no tag and keeps the Gradle defaults.
      - name: Derive the version from the release tag
        if: github.event_name == 'release'
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag '$tag' is not v<major>.<minor>.<patch>"
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be 0-99 so the version code keeps increasing"
            exit 1
          fi
          echo "VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        run: ./gradlew assembleRelease
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Name the APK after the release
        run: |
          tag="${{ github.event.release.tag_name || 'manual' }}"
          cp app/build/outputs/apk/release/app-release.apk "shopping-made-better-${tag}.apk"
          echo "APK=shopping-made-better-${tag}.apk" >> "$GITHUB_ENV"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Attach the APK to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
