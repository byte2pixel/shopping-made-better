name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compiles the app but does NOT run unit tests, so a failing test never
      # blocks a PR. Unit tests run on a schedule instead. see weekly-tests.yml
      - name: Build with Gradle
        run: ./gradlew assembleDebug
